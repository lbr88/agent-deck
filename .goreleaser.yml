# GoReleaser configuration
# https://goreleaser.com

version: 2

before:
  hooks:
    - go mod tidy
    # Note: go generate is intentionally NOT run here.
    # styles.css is a committed artifact with a drift gate enforced via lefthook
    # and make css-verify. Release builds use the committed CSS directly to
    # avoid requiring tailwindcss in the CI environment.

env:
  - GOTOOLCHAIN=go1.25.11

builds:
  - id: agent-deck
    main: ./cmd/agent-deck
    binary: agent-deck
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w -X main.Version={{.Version}}

archives:
  - id: default
    formats:
      - tar.gz
    name_template: >-
      {{ .ProjectName }}_
      {{- .Version }}_
      {{- .Os }}_
      {{- .Arch }}
    files:
      - README.md
      - LICENSE
      - CHANGELOG.md

checksum:
  name_template: 'checksums.txt'

snapshot:
  version_template: "{{ incpatch .Version }}-next"

changelog:
  sort: asc
  filters:
    exclude:
      - '^docs:'
      - '^test:'
      - '^chore:'
      - Merge pull request
      - Merge branch

release:
  draft: false
  prerelease: auto
  mode: append
  name_template: "v{{.Version}}"
  header: |
    ## Agent Deck v{{.Version}}

    Terminal session manager for AI coding agents.

    ### Installation

    **Self-update from an existing semver build:**
    ```bash
    agent-deck update --repo {{ .Env.GITHUB_REPOSITORY }}
    ```

    Or download the matching archive from this release and place the
    `agent-deck` binary on your `PATH`.
  footer: |
    ---

    **Full Changelog**: https://github.com/{{ .Env.GITHUB_REPOSITORY }}/compare/{{ .PreviousTag }}...{{ .Tag }}
